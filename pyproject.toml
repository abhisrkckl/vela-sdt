[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvela-sdt"
version = "0.0.1"
description = "A pipeline for running single-pulsar timing and noise analysis using Vela.jl."
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.12"

authors = [
    {name = "Abhimanyu Susobhanan", email = "abhisrkckl@gmail.com"},
]

maintainers = [
    {name = "Abhimanyu Susobhanan", email = "abhisrkckl@gmail.com"},
]

keywords = [
    "astronomy",
    "astrophysics",
    "pulsar",
]

license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "numpy>=2.1",
    "pint-pulsar>=1.1.3",
    "emcee",
    "pyvela",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/abhisrkckl/vela-sdt"
Documentation = "https://abhisrkckl.github.io/vela-sdt/"
Repository = "https://github.com/abhisrkckl/vela-sdt"

[project.scripts]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pyvela_sdt*"]

[tool.setuptools.package-data]
pyvela_sdt = ["*.*"]
